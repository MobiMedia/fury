<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Regions without semantic elements</title>
  <style>
    body { margin: 0; background: #ffffff; color: #222222; font-family: sans-serif; }
    #site-header { background: #000000; color: #ffffff; }
    .topbar { background: #d40000; height: 30px; }
    .bar { height: 70px; }
    .bar a { color: #ffffff; }
    .bar a.sale { color: #ffd700; }
    .page-content { padding: 20px; }
    h1 { color: #0a3d62; margin: 0 0 16px; }
    .cta { background: #0a3d62; color: #ffffff; padding: 12px 24px; border: 0; }
    .site-footer { background: #333333; color: #eeeeee; height: 100px; }
    .site-footer a { color: #eeeeee; }
  </style>
</head>
<body>
  <div id="site-header">
    <div class="topbar">Gratis Versand</div>
    <div class="bar"><a href="/">Home</a> <a class="sale" href="/sale">Sale</a></div>
  </div>
  <div class="page-content">
    <h1>Willkommen</h1>
    <p>Handgemachte Schuhe aus Hamburg, robust und bequem, für jeden Tag und jedes Wetter im Norden.</p>
    <button class="cta">Jetzt kaufen</button>
    <!-- Only the first slide is painted, the others are clipped away -->
    <div class="carousel" style="overflow: hidden; height: 200px; margin-top: 20px;">
      <div style="height: 200px; background: #00aa00;">Slide 1</div>
      <div style="height: 200px; background: #ff00ff;">Slide 2</div>
      <div style="height: 200px; background: #ff00ff;">Slide 3</div>
    </div>
    <div style="position: fixed; inset: 0; background: #123456; opacity: 0.6;"></div>
  </div>
  <div class="site-footer"><a href="/impressum">Impressum</a></div>
</body>
</html>
