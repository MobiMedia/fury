<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Inner scroll container</title>
  <style>
    /* The document is only as high as the viewport; the content scrolls inside #app */
    html, body { height: 100%; margin: 0; overflow: hidden; background: #ffffff; }
    #app { height: 100%; overflow-y: auto; }
    .spacer { height: 2500px; }
    .bottom { height: 500px; background: #0000ff; }
  </style>
</head>
<body>
  <div id="app">
    <div class="spacer">Oben</div>
    <div class="bottom">Unten</div>
  </div>
</body>
</html>
